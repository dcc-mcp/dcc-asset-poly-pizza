name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (Python ${{ matrix.python-version }}, Core ${{ matrix.core-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            core-version: "0.19.90"
            core-spec: "dcc-mcp-core==0.19.90"
          - python-version: "3.11"
            core-version: latest
            core-spec: dcc-mcp-core
    env:
      RUN_LIVE_API_SMOKE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      POLY_PIZZA_API_KEY: ${{ secrets.POLY_PIZZA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pyyaml "${{ matrix.core-spec }}"
      - run: python -c "import importlib.metadata as m; print(m.version('dcc-mcp-core'))"
      - run: python -m compileall skill tests
      - run: python tests/smoke_test.py

