tools:
  - name: search_poly_pizza_models
    description: Search Poly Pizza through its published API and return normalized license-aware model summaries.
    source_file: scripts/search_poly_pizza_models.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: poly-pizza
    input_schema:
      type: object
      properties:
        query: {type: string}
        category: {type: integer, minimum: 0, maximum: 11}
        license: {type: string, enum: [CC0, CC-BY]}
        animated: {type: boolean, default: false}
        limit: {type: integer, minimum: 1, maximum: 32, default: 20}
        page: {type: integer, minimum: 0, default: 0}
    output_schema:
      type: object

  - name: get_poly_pizza_model
    description: Fetch and validate one Poly Pizza model's metadata without downloading its GLB.
    source_file: scripts/get_poly_pizza_model.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: poly-pizza
    input_schema:
      type: object
      required: [model_id]
      properties:
        model_id: {type: string, minLength: 1, maxLength: 128}
    output_schema:
      type: object

  - name: download_poly_pizza_model
    description: Download one validated GLB atomically and return its receipt and portable AssetDescriptor.
    source_file: scripts/download_poly_pizza_model.py
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: poly-pizza
    input_schema:
      type: object
      required: [model_id, output_dir]
      properties:
        model_id: {type: string, minLength: 1, maxLength: 128}
        output_dir: {type: string, minLength: 1}
        overwrite: {type: boolean, default: false}
        max_bytes: {type: integer, minimum: 1024, maximum: 1073741824, default: 268435456}
    output_schema:
      type: object
      required: [asset_descriptor, receipt]
      properties:
        asset_descriptor: {type: object}
        receipt: {type: object}

